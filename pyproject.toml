[project]
name = "history-atlas"
version = "0.0.1"      # PEP 440 form of "v0.0.1" (atlaslib/common.py PROJECT["version"]); a test keeps the two in sync
description = "Vietnamese-language atlas of people who shaped human thought, 2000 BCE-2026"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

# Required: build.py cannot generate HTML without it.
dependencies = [
    "markdown==3.10.3",   # pinned to the version that produced the committed output
]

# The code DOES degrade gracefully without the two below (atlaslib/render.py:18
# and fetch_images.py:65 both catch ImportError), but the project's standard
# build — 355 embedded images — needs both.
# The canonical install command is therefore `uv sync --extra images`.
[project.optional-dependencies]
images = [
    "PyYAML>=6.0",   # read content/images.yaml fully instead of the minimal fallback parser
    "Pillow>=10",    # downscale originals when Commons returns no thumbnail
]

[dependency-groups]
dev = ["pytest>=8"]

# This is a script-run application (build.py, fetch_images.py at the root), not
# a library to publish, so uv need not build and install it into the venv.
[tool.uv]
package = false
